info:
  name: Login Sanctum
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/login"
  body:
    type: json
    data: |-
      {
        'email': 'test@example.com',
        'password': '12345678'
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
